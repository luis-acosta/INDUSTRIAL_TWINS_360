# Servidor de recorridos y proxy del servicio (X20)
#
# Recorrido y API comparten origen a propósito: así el navegador no necesita
# CORS, y una configuración de CORS que nadie revisa es una de las formas más
# comunes de dejar una API abierta de más.

server {
    listen 80;
    server_name _;

    # El tamaño no se limita aquí porque por esta vía no se sube nada: los
    # recorridos los copia el publicador en la carpeta, no se suben por HTTP.
    client_max_body_size 1m;

    # Cabeceras de seguridad. La política de contenido va en cada recorrido
    # —la escribe el publicador, que sabe qué orígenes enmarca ese proyecto—;
    # aquí van las que no dependen del contenido.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Sin «X-Frame-Options: DENY»: hay clientes que enmarcan el recorrido en su
    # propio portal, y prohibirlo aquí rompería ese uso legítimo sin que nadie
    # supiera por qué. El recorrido declara su propia política.

    # --- Recorridos publicados --------------------------------------------
    location /recorridos/ {
        alias /usr/share/nginx/html/recorridos/;
        # Índice por carpeta: cada recorrido es una carpeta con su index.html.
        try_files $uri $uri/ $uri/index.html =404;

        # Los medios llevan su huella en el nombre cuando el publicador los
        # renombra, pero el HTML y el manifiesto no: si se cachearan mucho, un
        # recorrido republicado seguiría viéndose viejo durante horas y el
        # cliente llamaría diciendo que no se publicó.
        location ~* \.(html|json)$ {
            add_header Cache-Control 'no-cache, must-revalidate' always;
        }

        location ~* \.(jpg|jpeg|png|webp|avif|glb|mp4|webm|m4a|mp3)$ {
            # Un medio cambia de nombre cuando cambia de contenido, así que se
            # puede cachear a lo grande: es lo que hace que la segunda visita a
            # un recorrido sea instantánea.
            add_header Cache-Control 'public, max-age=31536000, immutable' always;
        }
    }

    # --- Servicio ----------------------------------------------------------
    location /api/ {
        proxy_pass http://servicio:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una consulta de histórico de un año sobre un historiador lento tarda:
        # el plazo por omisión de 60 s cortaría la respuesta a mitad y el visor
        # mostraría un fallo de red que no lo es.
        proxy_read_timeout 120s;

        # Sin almacenamiento intermedio: la telemetría se pide para ver el
        # valor de ahora, y una respuesta servida de caché sería un valor viejo
        # presentado como actual. El visor ya distingue caché de dato en vivo
        # cuando él mismo lo guarda; una caché aquí se lo escondería.
        proxy_buffering off;
    }

    # --- Nada más ----------------------------------------------------------
    # La raíz no sirve nada: un listado de carpetas en la raíz diría a
    # cualquiera qué recorridos existen, y los nombres de los recorridos de una
    # planta son información del cliente.
    location = / {
        return 404;
    }
}
