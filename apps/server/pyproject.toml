[project]
name = "it360-server"
version = "0.14.0"
description = "Servidor de INDUSTRIAL TWINS 360: permisos, auditoría y telemetría de sólo lectura"
requires-python = ">=3.11"

# Versiones fijas, no rangos. Una compilación de hoy y otra de dentro de seis
# meses deben producir el mismo servidor: con «^» o «>=», cualquier publicación
# de un tercero cambia el producto sin que nadie lo decida.
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.5",
  "httpx==0.28.1",
  "asyncpg==0.30.0",
  "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "ruff==0.9.2",
  "mypy==1.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
# El modelo de permisos es generado y no se revisa a mano.
exclude = ["app/access_model.py"]
