# Verificación en cada cambio.
#
# El orden de los pasos es deliberado: lo que falla rápido y señala la causa va
# primero. Un desajuste del modelo de permisos se detecta en dos segundos y
# dice exactamente qué regenerar; esperar a que fallen las pruebas del servidor
# daría la misma información veinte veces más tarde.
name: Verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm

      # `npm ci` y no `npm install`: instala las versiones exactas del lockfile.
      # Con `install`, una publicación de un tercero cambia lo que se verifica.
      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Binario WASM al día
        run: npm run verify:wasm

      - name: Modelo de permisos al día
        run: npm run verify:access

      - name: Pruebas
        run: npm run test

      - name: Compilar la aplicación
        run: npm run build --workspace @it360/desktop

      - name: Compilar el visor publicado
        run: npm run build:viewer

  python:
    name: Servidor y cosido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias del servidor
        run: pip install -e "apps/server[dev]"

      - name: Pruebas del servidor
        run: python -m pytest apps/server

      - name: Dependencias del cosido
        run: pip install -e "services/stitcher[cv,dev]"

      - name: Pruebas del cosido
        run: python -m pytest services/stitcher

  extremo-a-extremo:
    name: Extremo a extremo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm

      - run: npm ci

      # El navegador se instala aquí y no en el trabajo anterior: las pruebas
      # unitarias no lo necesitan y descargarlo costaría un minuto en cada
      # ejecución sin aportar nada.
      - run: npx playwright install chrome --with-deps

      - name: Pruebas de extremo a extremo
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rastros-playwright
          path: test-results/
          retention-days: 7

  instalador-windows:
    name: Instalador de Windows
    runs-on: windows-latest
    # Compilar el instalador cuesta varios minutos y sólo interesa en la rama
    # principal: en una propuesta de cambio basta con que compile la interfaz.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # El contenedor empaqueta el visor publicado como recurso, así que su
      # script de compilación exige que exista antes de compilar nada de Rust.
      # `tauri build` lo construye por su cuenta; las pruebas de Rust, que
      # corren antes, necesitan que ya esté ahí.
      - name: Compilar el visor publicado
        run: npm run build:viewer

      # Las pruebas de Rust antes del empaquetado: cuestan segundos y, cuando
      # algo falla en el contenedor, dicen qué, mientras que el empaquetado
      # tarda varios minutos en llegar al mismo sitio con menos detalle.
      - name: Pruebas de Rust
        run: cargo test --lib --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Compilar instaladores
        run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: instaladores
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
